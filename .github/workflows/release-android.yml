name: Android Release

on:
  workflow_dispatch:
    inputs:
      deploy_to_play_store:
        description: Deploy this release to the Google Play internal track
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      KEYSTORE_PATH: android/app/upload-keystore.jks
      AAB_PATH: build/app/outputs/bundle/release/app-release.aab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Dart packages
        run: flutter pub get

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "Missing ANDROID_STORE_PASSWORD secret"; exit 1; }

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      - name: Create Android key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cat <<EOF > android/key.properties
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF

      - name: Verify app quality gates
        run: |
          flutter analyze
          flutter test
          flutter test integration_test

      - name: Build signed Android App Bundle
        run: flutter build appbundle --release

      - name: Upload Android bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error

      - name: Upload ProGuard and mapping outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-support-files
          path: |
            build/app/outputs/mapping/release
            build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib
          if-no-files-found: ignore

      - name: Deploy to Google Play internal track
        if: |
          secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' &&
          (github.event_name == 'push' || inputs.deploy_to_play_store)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.samkelomakeleni.logstandings
          releaseFiles: ${{ env.AAB_PATH }}
          track: internal
          status: completed
